name: bizops360_mobile
description: "BizOps 360 field operations app for agency staff and managers."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  # Material/Cupertino/Widgets localizations for non-English locales (bn_BD).
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State, routing and DI.
  get: ^4.7.3

  # Networking.
  dio: ^5.11.1

  # Storage: token in the keychain/keystore, everything else in a fast KV box.
  flutter_secure_storage: ^11.0.0
  get_storage: ^2.1.1

  # Presentation.
  google_fonts: ^8.2.1
  intl: ^0.20.2 # pinned to 0.20.2 by flutter_localizations

  # Value equality for entities.
  equatable: ^2.1.0
  flutter_screenutil: ^5.9.3
  firebase_core: ^4.14.0
  firebase_crashlytics: ^5.3.0
  firebase_messaging: ^16.6.0
  flutter_local_notifications: 18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  image: ^4.9.2 # tool/crop_icon.dart only
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

# Regenerate: dart run tool/crop_icon.dart && dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/icon/app_icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 24
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  web:
    generate: true
    image_path: assets/icon/app_icon.png
    background_color: "#FFFFFF"
    theme_color: "#1C6B54"
